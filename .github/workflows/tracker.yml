name: Track Search Spikes to JSON

on:
  schedule:
    # Har 2 ghante mein automatic run hoga
    - cron: '0 */2 * * *'
  # GitHub Actions tab se manual run karne ke liye
  workflow_dispatch:

# Generated JSON file ko repo me save/commit karne ke liye permission
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Tracker Script
        run: |
          python spike_tracker.py

      - name: Commit and Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trending_spikes.json
          # Agar data me koi change ho tabhi commit karega
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trending spikes JSON [skip ci]" && git push)
