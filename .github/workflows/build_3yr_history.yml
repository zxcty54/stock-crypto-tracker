name: Generate & Sync 3-Year Historical OHLCV Dataset

on:
  # Sunday ko 11:30 PM IST (18:00 UTC) par auto-update
  schedule:
    - cron: '0 18 * * 0'
  # GitHub Actions tab se manual run karne ke liye
  workflow_dispatch:

jobs:
  build-and-sync-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch 3-Year OHLCV Data
        run: |
          python build_3yr_history.py

      - name: Commit & Push Dataset to Backend Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f historical_3yr_ohlc.json ]; then
            git add historical_3yr_ohlc.json
            if git diff --staged --quiet; then
              echo "ℹ️ No changes in historical dataset."
            else
              git commit -m "📊 Update: 3-Year OHLCV Dataset [$(date +'%d-%b-%Y')]"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Direct Sync to Target App Repo (stock-crypto-tracker)
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import base64
          import requests
          from datetime import datetime

          token = os.environ.get("GH_PAT_TOKEN", "").strip()
          target_repo = "zxcty54/stock-crypto-tracker"
          target_path = "historical_3yr_ohlc.json"
          target_branch = "main"
          local_file = "historical_3yr_ohlc.json"

          if not token:
              print("⚠️ GH_PAT_TOKEN missing. Skipping remote push.")
              exit(0)

          if not os.path.exists(local_file):
              print(f"⚠️️ {local_file} not found locally.")
              exit(0)

          with open(local_file, "rb") as f:
              b64_data = base64.b64encode(f.read()).decode("utf-8")

          api_url = f"https://api.github.com/repos/{target_repo}/contents/{target_path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Historical-OHLC-Sync"
          }

          # Check existing SHA
          sha = None
          res = requests.get(api_url, headers=headers, params={"ref": target_branch}, timeout=15)
          if res.status_code == 200:
              sha = res.json().get("sha")

          payload = {
              "message": f"📊 Auto-Sync 3-Year OHLCV Data [{datetime.now().strftime('%d-%b-%Y')}]",
              "content": b64_data,
              "branch": target_branch
          }
          if sha:
              payload["sha"] = sha

          put_res = requests.put(api_url, headers=headers, json=payload, timeout=30)
          if put_res.status_code in [200, 201]:
              print(f"✅ Successfully synced 3-year data to https://github.com/{target_repo}")
          else:
              print(f"❌ Failed to push to app repo ({put_res.status_code}): {put_res.text}")
          EOF
