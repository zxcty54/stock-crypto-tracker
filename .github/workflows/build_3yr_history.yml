name: Generate & Sync 5-Year Historical OHLCV Dataset

on:
  schedule:
    # Har Sunday raat 11:30 PM IST par auto-sync
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  build-and-sync-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 5Y OHLCV Scraper & Sync
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          python build_5yr_history.py

      - name: Commit & Push Locally to Backend Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f historical_5yr_ohlc.json ]; then
            git add historical_5yr_ohlc.json
            if git diff --staged --quiet; then
              echo "ℹ️ No changes in historical dataset."
            else
              git commit -m "📊 Auto-Update: 5Y OHLC for 6 Stocks [$(date +'%d-%b-%Y')]"
              git pull --rebase origin main
              git push origin main
            fi
          fi
