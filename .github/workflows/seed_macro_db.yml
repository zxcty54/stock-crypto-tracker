name: Seed Macro DB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber openpyxl pypdf

      - name: Execute Seeder Script
        run: python seed_historical_macro_db.py

      - name: Verify File Exists
        run: |
          ls -lh macro_historical_db.json
          python -m json.tool macro_historical_db.json > /dev/null
          echo "JSON validation: OK"
          head -n 25 macro_historical_db.json

      - name: Commit and Push DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add macro_historical_db.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Seed: Macro Historical DB [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
