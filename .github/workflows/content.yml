name: 🏭 AI Content Factory

on:
  schedule:
    # ⏰ Har Monday subah 08:30 AM IST (03:00 UTC) par automatically chalega
    - cron: '0 3 * * 1'
  workflow_dispatch: # Agar kabhi manually button dabana ho toh seedha bina options ke chalega

permissions:
  contents: write

concurrency:
  group: content-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet groq google-genai requests

      - name: 🏭 Run Content Factory (Auto-Generate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python content_generator.py

      - name: 💾 Commit & Push (Zero-Conflict Overwrite)
        if: always()
        run: |
          git config --global user.name "ContentFactoryBot"
          git config --global user.email "bot@github-actions.internal"

          # 1. Jo fresh files bani hain unhe /tmp me safe backup karo
          cp content_queue.json /tmp/content_queue.json 2>/dev/null || true
          cp content_topics_used.json /tmp/content_topics_used.json 2>/dev/null || true

          # 2. Remote se clean sync karo
          git fetch origin main
          git reset --hard origin/main

          # 3. Fresh files ko wapas restore karo
          cp /tmp/content_queue.json content_queue.json 2>/dev/null || true
          cp /tmp/content_topics_used.json content_topics_used.json 2>/dev/null || true

          # 4. Commit aur push sirf tab karo jab actual naya data bana ho
          git add content_queue.json content_topics_used.json
          if git diff --staged --quiet; then
            echo "ℹ️ Queue is full (Runway >= 20 days) or no changes. Skipping commit."
          else
            git commit -m "🤖 Auto-Update: Fresh Content Queue [skip ci]"
            git push origin main
            echo "✅ Successfully pushed fresh content queue to repository!"
          fi
