name: 🏭 AI Content Factory

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action (pehli baar "keys" chalao)'
        required: true
        default: 'keys'
        type: choice
        options: [keys, generate, force, report, dry-run]
      count:
        description: 'Kitne posts (default 24)'
        required: false
        default: '24'

permissions:
  contents: write

concurrency:
  group: content-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: pip install --quiet groq google-genai requests

      - name: 🔍 Repo me kaunsi keys hain (names only)
        if: github.event.inputs.mode == 'keys'
        continue-on-error: true
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          for label, raw in (("🔑 SECRETS", os.environ.get("SECRETS_JSON")),
                             ("📋 VARIABLES", os.environ.get("VARS_JSON"))):
              try:
                  d = json.loads(raw or "{}")
              except Exception:
                  d = {}
              names = sorted(d.keys()) if d else []
              print(f"{label}: {names if names else '(kuch nahi mila — yahan khaali hai)'}")
          PYEOF

      - name: 🏭 Run content factory
        env:
          GEMINI_API_KEY:   "${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_GENAI_API_KEY || secrets.GOOGLE_KEY }}"
          GEMINI_API_KEY2:  "${{ secrets.GEMINI_API_KEY2 || secrets.GOOGLE_API_KEY2 }}"
          GOOGLE_API_KEY:   "${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_GENAI_API_KEY || secrets.GOOGLE_KEY }}"
          GOOGLE_API_KEY2:  "${{ secrets.GOOGLE_API_KEY2 || secrets.GEMINI_API_KEY2 }}"
          GROQ_API_KEY:     "${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ_API_KEY_1 }}"
          GROQ_API_KEY2:    "${{ secrets.GROQ_API_KEY2 || secrets.GROQ_KEY2 || secrets.GROQ_API_KEY_2 }}"
        run: |
          MODE="${{ github.event.inputs.mode }}"
          COUNT="${{ github.event.inputs.count }}"
          [ -z "$MODE" ] && MODE="generate"
          [ -z "$COUNT" ] && COUNT="24"
          echo "▶️ mode: $MODE | count: $COUNT"
          case "$MODE" in
            keys)    python content_generator.py --keys ;;
            report)  python content_generator.py --report ;;
            force)   python content_generator.py --force --count "$COUNT" ;;
            dry-run) python content_generator.py --force --dry-run --count "$COUNT" ;;
            *)       python content_generator.py --count "$COUNT" ;;
          esac

      - name: 💾 Persist queue & topic memory
        if: always()
        run: |
          git config user.name  "ai-channel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content_queue.json content_topics_used.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "🏭 content factory [$(date -u +'%d-%b-%Y %H:%M UTC')]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
