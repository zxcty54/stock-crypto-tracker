name: 🏭 AI Content Factory

# Weekly: Somwar 08:30 IST = 03:00 UTC
# Queue me 20 din se kam content bacha ho to naye posts banata hai
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action'
        required: true
        default: 'generate'
        type: choice
        options: [generate, force, report, dry-run]
      count:
        description: 'Kitne posts (default 24)'
        required: false
        default: '24'

permissions:
  contents: write

concurrency:
  group: content-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: pip install --quiet groq google-genai requests

      - name: 🏭 Run content factory
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:   ${{ secrets.GROQ_API_KEY2 }}
          GOOGLE_API_KEY:  ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GEMINI_API_KEY:  ${{ secrets.GOOGLE_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$MODE" ]; then MODE="generate"; fi
          if [ -z "$COUNT" ]; then COUNT="24"; fi
          echo "▶️ mode: $MODE | count: $COUNT"
          case "$MODE" in
            report)  python content_generator.py --report ;;
            force)   python content_generator.py --force --count "$COUNT" ;;
            dry-run) python content_generator.py --force --dry-run --count "$COUNT" ;;
            *)       python content_generator.py --count "$COUNT" ;;
          esac

      - name: 💾 Persist queue & topic memory
        if: always()
        run: |
          git config user.name  "ai-channel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content_queue.json content_topics_used.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "🏭 content factory [$(date -u +'%d-%b-%Y %H:%M UTC')]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
            echo "✅ queue + topic memory committed"
          else
            echo "ℹ️ no change"
          fi

      - name: 📊 Summary
        if: always()
        run: |
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json, os
          if os.path.exists("content_queue.json"):
              q = json.load(open("content_queue.json"))
              items = q.get("queue", [])
              print("## 🏭 Content Factory Report\n")
              print(f"- **Queue total**: {len(items)} posts")
              print(f"- **Last scheduled**: {q.get('last_scheduled')} IST")
              ai = len([i for i in items if i.get("ai_generated")])
              print(f"- **AI-generated**: {ai}")
          if os.path.exists("content_topics_used.json"):
              u = json.load(open("content_topics_used.json"))
              print(f"- **Topics covered**: {len(u)}")
          EOF
          cat $GITHUB_STEP_SUMMARY
