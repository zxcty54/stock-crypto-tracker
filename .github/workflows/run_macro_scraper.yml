name: Run Unified Macro Scraper

on:
  schedule:
    # Har Monday aur Thursday 06:15 AM IST (00:45 UTC)
    - cron: '45 0 * * 1,4'
  workflow_dispatch: # Actions tab se manual test button

permissions:
  contents: write

jobs:
  scrape-macro-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests curl_cffi pypdf pdfplumber

      - name: Execute Unified Master Scraper
        run: python macro_master_scraper.py

      - name: Verify Updated Files
        run: |
          ls -la macro_latest_telemetry.json macro_historical_db.json
          head -n 25 macro_latest_telemetry.json

      - name: Commit and Push Updated Telemetry & DB
        run: |
          git config --global user.name "MacroScraperBot"
          git config --global user.email "bot@macro-radar.internal"

          [ -f macro_latest_telemetry.json ] && git add macro_latest_telemetry.json
          [ -f macro_historical_db.json ] && git add macro_historical_db.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "⚡ Update: Master Macro Telemetry & Historical Sync [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
