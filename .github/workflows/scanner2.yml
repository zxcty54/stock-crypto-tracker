name: Run Daily Stock Scanner

on:
  schedule:
    # Mon-Fri 4:15 PM IST (10:45 AM UTC)
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scanner
        run: python market_scanner.py

      - name: Commit & Push Scanner Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner_output.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scanner output [skip ci]" && git push)
