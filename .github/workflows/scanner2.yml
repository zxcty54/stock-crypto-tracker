name: Daily Breakout Scanner

on:
  schedule:
    # Monday to Friday 4:15 PM IST (10:45 AM UTC)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Actions tab se manually 'Run workflow' button dabane ke liye

permissions:
  contents: write # Output file commit aur push karne ke liye required

jobs:
  run-breakout-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Market Scanner
        run: python market_scanner.py

      - name: Commit and Push Breakout Signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add breakout_signals.json
          git diff --staged --quiet || (git commit -m "Auto-update breakout signals [skip ci]" && git push)
