name: Weekly Rally Scanner

on:
  schedule:
    # Friday market close hone ke baad: 4:30 PM IST (11:00 AM UTC)
    - cron: '0 11 * * 5'
  workflow_dispatch: # GitHub Actions tab se manual run ke liye

permissions:
  contents: write # weekly_signals.json commit & push karne ke liye required

jobs:
  run-weekly-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Weekly Rally Scanner
        run: python weekly.py

      - name: Commit and Push Weekly Signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_signals.json
          git diff --staged --quiet || (git commit -m "Auto-update weekly signals [skip ci]" && git push)
