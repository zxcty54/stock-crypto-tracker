name: Sync IBJA Bullion Benchmark

on:
  schedule:
    # 07:00 UTC = 12:30 PM IST (Mon-Fri)
    - cron: '0 7 * * 1-5'
    # 12:00 UTC = 05:30 PM IST (Mon-Fri)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz yfinance

      - name: Run IBJA Fetch Script
        run: python fetch_ibja_rates.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ibja_rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IBJA Bullion Rates [skip ci]" && git push)
