name: Automated Monthly MF Smart Money & Infiltration Radar

on:
  schedule:
    # ⏰ Har mahine ki 11 tareekh ko raat 7:30 PM IST (14:00 UTC) par execute hoga
    # (SEBI ke 10th monthly portfolio disclosure deadline ke turant baad)
    - cron: '0 14 11 * *'
  workflow_dispatch: # Manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-mf-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl beautifulsoup4

      - name: 🚀 Execute MF Smart Money Infiltration Engine (100% Real Scraped & AMFI Data)
        run: |
          python mf_smart_money_hunter.py

      - name: 💾 Commit and Push Updated Radar JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Freshly generated JSONs ko safe location (/tmp) par backup karein
          mkdir -p /tmp/mf_backup
          cp assets/data/mf_smart_money_radar.json /tmp/mf_backup/mf_smart_money_radar.json
          [ -f "mf_smart_money_radar.json" ] && cp mf_smart_money_radar.json /tmp/mf_backup/mf_smart_money_radar_root.json

          # 2. Latest remote pull karein
          git pull --rebase origin main || true

          # 3. Fresh reports wapas paste karein
          mkdir -p assets/data
          cp /tmp/mf_backup/mf_smart_money_radar.json assets/data/mf_smart_money_radar.json
          [ -f "/tmp/mf_backup/mf_smart_money_radar_root.json" ] && cp /tmp/mf_backup/mf_smart_money_radar_root.json mf_smart_money_radar.json

          # 4. Check karein agar actual changes hain
          git add assets/data/mf_smart_money_radar.json mf_smart_money_radar.json
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in mf_smart_money_radar.json. Skipping commit."
          else
            git commit -m "🤖 Auto-Update: Monthly MF Smart Money & Infiltration Radar [skip ci]"
            git push origin HEAD:main
            echo "✅ Successfully pushed updated MF Smart Money Radar to repository!"
          fi
