name: Hourly NSE Scraper & AI Summarizer Pipeline

on:
  schedule:
    # Post-market: Har 2 ghante par 4:00 PM IST se agle din 8:30 AM IST tak (Market hours 9:00 AM - 4:00 PM OFF)
    # 10:30 UTC (16:00 IST), 12:30 UTC (18:00 IST), 14:30 UTC (20:00 IST), 16:30 UTC (22:00 IST), 18:30 UTC (00:00 IST), 20:30 UTC (02:00 IST), 22:30 UTC (04:00 IST), 00:30 UTC (06:00 IST), 02:30 UTC (08:00 IST)
    - cron: '30 0,2,10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

jobs:
  scrape-and-summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pypdf pdfplumber google-genai groq requests

      - name: Step 1 - Execute NSE Scraper Engine
        run: |
          python nse_daily_master_scraper.py

      - name: Step 2 - Execute Hybrid AI Summarizer & Sync to App Repo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          python nse_ai_summarizer.py

      - name: Step 2.5 - Update Institutional Risk Radar & FII/DII Futures OI
        run: |
          python global_economy_radar_hunter.py || true

      - name: Step 3 - Commit and Push Master & AI Content Feed Locally
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          [ -f nse_corporate_master.json ] && git add nse_corporate_master.json
          [ -f nse_content_feed.json ] && git add nse_content_feed.json
          [ -f global_economy_radar.json ] && git add global_economy_radar.json assets/data/global_economy_radar.json

          if git diff --staged --quiet; then
            echo "ℹ️ Koi naya update nahi mila. Skipping commit."
          else
            git commit -m "⚡ Auto-Update: Master & AI Content Feed [$(date +'%d-%b-%Y %H:%M IST')]"
            git pull --rebase origin main
            git push origin main
          fi
