name: Sector News & Intelligence Harvester

on:
  schedule:
    # 1. Post-Market Close: Mon-Fri at 12:00 UTC (5:30 PM IST)
    - cron: '00 12 * * 1-5'
    # 2. Pre-Market Check: Mon-Fri at 02:45 UTC (8:15 AM IST)
    - cron: '45 2 * * 1-5'
  workflow_dispatch:

jobs:
  harvest-sector-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Live Sector News Feeds & Institutional Radar
        run: |
          python sector_news_crawler.py
          python global_economy_radar_hunter.py || true

      - name: Direct Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A sector_live_feed.json assets/data/sector_live_feed.json global_economy_radar.json assets/data/global_economy_radar.json
          if git diff --staged --quiet; then
            echo "ℹ️ No new sector news items. Skipping push."
          else
            git commit -m "⚡ Auto-Update: Sector Intelligence Feed [$(date +'%d-%b-%Y %H:%M IST')]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Sector intelligence feed pushed to main!"
          fi
