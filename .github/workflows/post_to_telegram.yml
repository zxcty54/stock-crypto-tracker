name: 📢 Post Content to Telegram

on:
  workflow_dispatch: # Manual queue-post test; automatic sends run after each scrape.

permissions:
  contents: write

concurrency:
  group: content-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Requests
        run: pip install requests

      - name: 🚀 Dispatch Post to Telegram & Telegraph
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_poster.py --queue-only

      - name: 💾 Commit Updated Queue and State Files
        run: |
          git config --global user.name "TelegramPosterBot"
          git config --global user.email "bot@github-actions.internal"

          # 1. State files ko safe backup (/tmp) folder me copy karein
          mkdir -p /tmp/state_backup
          [ -f content_queue.json ] && cp content_queue.json /tmp/state_backup/
          [ -f nse_content_feed.json ] && cp nse_content_feed.json /tmp/state_backup/
          [ -f telegraph_state.json ] && cp telegraph_state.json /tmp/state_backup/
          [ -f post_log.json ] && cp post_log.json /tmp/state_backup/

          # 2. Current workflow ref se hard sync karein (selected branch ko hi update karein)
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          # 3. Updated state files ko wapas restore karein
          [ -f /tmp/state_backup/content_queue.json ] && cp /tmp/state_backup/content_queue.json content_queue.json
          [ -f /tmp/state_backup/nse_content_feed.json ] && cp /tmp/state_backup/nse_content_feed.json nse_content_feed.json
          [ -f /tmp/state_backup/telegraph_state.json ] && cp /tmp/state_backup/telegraph_state.json telegraph_state.json
          [ -f /tmp/state_backup/post_log.json ] && cp /tmp/state_backup/post_log.json post_log.json

          # 4. Stage aur commit karein
          git add content_queue.json nse_content_feed.json telegraph_state.json post_log.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "🤖 Update: Dispatched post & synced Telegraph state [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
            echo "✅ Queue and state files cleanly committed."
          fi
