name: Generate Verified Company Business Models

on:
  workflow_dispatch: # Manual trigger from GitHub UI
  schedule:
    # Runs on the 1st of every month at midnight UTC (05:30 AM IST)
    - cron: '0 0 1 * *'

# Grant write permissions to commit and push the updated JSON
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas

      - name: Execute Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_company_fundamentals.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add company_business_models.json

          # Only commit if changes are present
          if git diff --staged --quiet; then
            echo "No changes detected in business models data."
          else
            git commit -m "chore(data): auto-update audited company business models [skip ci]"
            git push
          fi
