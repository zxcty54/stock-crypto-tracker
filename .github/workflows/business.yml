name: Business News Preview (No Telegram)

on:
  workflow_dispatch:
    inputs:
      include_ai:
        description: "Also generate a sample educational Hinglish draft (if the existing Gemini/Groq key is configured)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install --quiet requests

      - name: Fetch and preview current business news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NEWS_PREVIEW_AI: ${{ inputs.include_ai }}
        run: python daily_business_news.py preview

      - name: Download the preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-news-preview
          path: |
            business_news_preview.md
            business_news_preview.json
          if-no-files-found: warn
          retention-days: 7
