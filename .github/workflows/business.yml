name: Daily Business News Archive & Telegram Queue

on:
  schedule:
    # Daily at 18:30 IST (GitHub Actions cron uses UTC).
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: "Scrape/enrich and queue a news post, backfill existing stories, or run a preview"
        required: true
        type: choice
        options:
          - preview
          - archive
          - enrich
        default: preview
      include_ai:
        description: "For preview only: generate an educational Hinglish draft when an AI key is configured"
        required: true
        type: boolean
        default: true

concurrency:
  group: business-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'archive' || github.event.inputs.task == 'enrich')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install --quiet requests

      - name: Scrape RSS, enrich the archive, and queue a post-ready news draft
        if: ${{ github.event_name == 'schedule' || github.event.inputs.task == 'archive' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NEWS_ARCHIVE_AI_MAX_STORIES: "24"
          NEWS_ARCHIVE_AI_BATCH_SIZE: "4"
        run: python daily_business_news.py archive

      - name: Enrich the existing archive without scraping RSS
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'enrich' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NEWS_ARCHIVE_AI_MAX_STORIES: "24"
          NEWS_ARCHIVE_AI_BATCH_SIZE: "4"
        run: python daily_business_news.py enrich

      - name: Commit updated archive and Telegram queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add business_news_archive.json content_queue.json
          if [ -f daily_news_state.json ]; then
            git add daily_news_state.json
          fi
          if git diff --cached --quiet; then
            echo "No archive or queue changes to commit."
          else
            git commit -m "data(news): update business archive and Telegram queue [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
          fi

  preview:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install --quiet requests

      - name: Fetch and preview current business news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NEWS_PREVIEW_AI: ${{ inputs.include_ai }}
        run: python daily_business_news.py preview

      - name: Download the preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-news-preview
          path: |
            business_news_preview.md
            business_news_preview.json
          if-no-files-found: warn
          retention-days: 7
