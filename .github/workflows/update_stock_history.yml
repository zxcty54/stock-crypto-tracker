name: Daily Stock Pipeline & Scanner

on:
  schedule:
    # Monday to Friday shaam 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Actions tab se manual run karne ke liye

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Isi repo mein direct commit aur push karne ki permission

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: 1. Update Daily Rolling History (Add Today, Drop 11th Day)
        run: |
          python update_daily_history.py

      - name: 2. Run Strategy Scanner (Generate Squeeze & Breakout Watchlist)
        run: |
          python run_strategy.py

      - name: 3. Commit & Push Updated Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_history_20d.json scanner_output.json
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected. Data already up-to-date."
          else
            git commit -m "📊 Daily Pipeline: Updated 10D Cache & Scanner Output [$(date +'%d-%b-%Y')]"
            git push origin main
            echo "✅ Successfully updated stock_history_20d.json and scanner_output.json"
          fi
