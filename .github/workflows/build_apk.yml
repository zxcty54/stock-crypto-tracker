name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton, Permissions, Share Intent & SDK 37
        run: |
          flutter create . --project-name stockpulse --org com.stockpulse --platforms=android
          
          # 1. Storage & Internet Permissions inject karein
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml
          
          # 2. Gallery se direct image share accept karne ke liye Intent Filter inject karein
          sed -i '/<\/activity>/i <intent-filter>\n    <action android:name="android.intent.action.SEND" />\n    <category android:name="android.intent.category.DEFAULT" />\n    <data android:mimeType="image/*" />\n</intent-filter>' android/app/src/main/AndroidManifest.xml
          
          # 3. compileSdk ko 37 par force karein taaki checkReleaseAarMetadata fail na ho
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk 3[0-6]/compileSdk 37/g' {} +
          
          flutter pub get

      - name: Restore Permanent Keystore & Inject Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKPULSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Clean spaces/newlines aur safely decode
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/keystore/upload-keystore.jks
            
            # key.properties create karein
            cat <<EOF > android/key.properties
          storePassword=stockpulse@123
          keyPassword=stockpulse@123
          keyAlias=stockpulse-key
          storeFile=keystore/upload-keystore.jks
          EOF

            # Kotlin DSL (build.gradle.kts) & Groovy me V1 & V2 signed release block inject karein
            python3 -c '
          import os

          gradle_kts = "android/app/build.gradle.kts"
          gradle_groovy = "android/app/build.gradle"

          signing_code_kts = """
              signingConfigs {
                  create("release") {
                      storeFile = file("${project.projectDir}/keystore/upload-keystore.jks")
                      storePassword = "stockpulse@123"
                      keyAlias = "stockpulse-key"
                      keyPassword = "stockpulse@123"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          """

          signing_code_groovy = """
              signingConfigs {
                  release {
                      storeFile file("${project.projectDir}/keystore/upload-keystore.jks")
                      storePassword "stockpulse@123"
                      keyAlias "stockpulse-key"
                      keyPassword "stockpulse@123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          """

          if os.path.exists(gradle_kts):
              with open(gradle_kts, "r") as f:
                  content = f.read()
              if "android {" in content:
                  content = content.replace("android {", "android {\n" + signing_code_kts, 1)
                  with open(gradle_kts, "w") as f:
                      f.write(content)
                  print("Injected V1+V2 release signing into build.gradle.kts")

          elif os.path.exists(gradle_groovy):
              with open(gradle_groovy, "r") as f:
                  content = f.read()
              if "android {" in content:
                  content = content.replace("android {", "android {\n" + signing_code_groovy, 1)
                  with open(gradle_groovy, "w") as f:
                      f.write(content)
                  print("Injected V1+V2 release signing into build.gradle")
          '
          else
            echo "ERROR: Keystore secret is empty!"
            exit 1
          fi

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk/
          zip stockpulse-app.zip app-release.apk

      - name: Upload ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockpulse-app-zip
          path: build/app/outputs/flutter-apk/stockpulse-app.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document=@"build/app/outputs/flutter-apk/stockpulse-app.zip" \
               -F caption="StockPulse (Signed V1+V2 & Updatable APK) 🚀" \
               https://api.telegram.org/bot$BOT_TOKEN/sendDocument
