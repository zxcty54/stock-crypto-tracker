name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Dependencies
        run: |
          # Package name com.stockmarket set karne ke liye
          flutter create . --project-name stockpulse --org com --platforms=android
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk/
          zip stockmarket-app.zip app-release.apk

      - name: Upload ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockmarket-app-zip
          path: build/app/outputs/flutter-apk/stockmarket-app.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document=@"build/app/outputs/flutter-apk/stockmarket-app.zip" \
               -F caption="Stock Market App (com.stockmarket) - Ready! 🚀" \
               https://api.telegram.org/bot$BOT_TOKEN/sendDocument
