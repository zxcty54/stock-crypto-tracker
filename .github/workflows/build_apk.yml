name: Build & Release Flutter APK

on:
  workflow_dispatch: # Actions tab se button click karke run karne ke liye
  push:
    branches:
      - main
    paths-ignore:
      - '**.json'
      - '**.md'
      - '.github/workflows/macro_research_pipeline.yml'
      - '.github/workflows/raw_material_matrix.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKPULSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'STOCKPULSE_KEYSTORE_BASE64' is missing or empty!"
            exit 1
          fi

          # Decode Base64 string into JKS file
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/keystore/upload-keystore.jks

          if [ ! -s android/app/keystore/upload-keystore.jks ]; then
            echo "::error::Keystore file decoded as 0 bytes. Check secret value!"
            exit 1
          fi

          echo "Keystore successfully restored:"
          ls -lh android/app/keystore/upload-keystore.jks

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify Signature
        run: |
          echo "=== VERIFYING RELEASE SIGNATURE ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-crypto-tracker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
