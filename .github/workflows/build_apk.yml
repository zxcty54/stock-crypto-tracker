name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Add Permissions
        run: |
          flutter create . --project-name stockpulse --org com --platforms=android
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk/
          zip stockpulse-app.zip app-release.apk

      - name: Upload ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockpulse-app-zip
          path: build/app/outputs/flutter-apk/stockpulse-app.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document=@"build/app/outputs/flutter-apk/stockpulse-app.zip" \
               -F caption="StockPulse (Dalal Street Update) - App Ready! 🚀" \
               https://api.telegram.org/bot$BOT_TOKEN/sendDocument
