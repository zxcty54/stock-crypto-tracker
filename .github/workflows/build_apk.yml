name: Build & Release Flutter APK

on:
  workflow_dispatch: # Actions tab se button click karke run karne ke liye
  push:
    branches:
      - main
    paths-ignore:
      - '**.json'
      - '**.md'
      - '.github/workflows/macro_research_pipeline.yml'
      - '.github/workflows/raw_material_matrix.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Optional check if you have analyzer issues
      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-crypto-tracker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
