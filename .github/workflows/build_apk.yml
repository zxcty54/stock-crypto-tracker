name: Build & Release Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.json'
      - '**.md'
      - '.github/workflows/macro_research_pipeline.yml'
      - '.github/workflows/raw_material_matrix.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKPULSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'STOCKPULSE_KEYSTORE_BASE64' is missing or empty!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/keystore/upload-keystore.jks

          if [ ! -s android/app/keystore/upload-keystore.jks ]; then
            echo "::error::Keystore file decoded as 0 bytes. Check secret value!"
            exit 1
          fi

          echo "Keystore successfully restored."

      - name: Get Dependencies
        run: flutter pub get

      # 🎨 App Launcher Icons Generation (APK compile hone se pehle mipmap folders create honge)
      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk/
          zip stockpulse-app.zip app-release.apk

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN ya TELEGRAM_CHAT_ID secret missing hai!"
            exit 1
          fi

          curl -F chat_id="$CHAT_ID" \
               -F document=@"build/app/outputs/flutter-apk/stockpulse-app.zip" \
               -F caption="StockPulse (Latest Signed APK Build) 🚀" \
               https://api.telegram.org/bot$BOT_TOKEN/sendDocument
