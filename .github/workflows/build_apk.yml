name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Restore Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKPULSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/keystore/upload-keystore.jks
            echo "Keystore successfully restored."
          else
            echo "ERROR: STOCKPULSE_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK Signature
        run: |
          echo "=== VERIFYING RELEASE SIGNATURE ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk/
          zip stockpulse-app.zip app-release.apk

      - name: Upload ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockpulse-app-zip
          path: build/app/outputs/flutter-apk/stockpulse-app.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document=@"build/app/outputs/flutter-apk/stockpulse-app.zip" \
               -F caption="StockPulse (Permanent Signed Build) 🚀" \
               https://api.telegram.org/bot$BOT_TOKEN/sendDocument
