name: Dynamic Macro Documents Crawler (Playwright Engine)

on:
  schedule:
    - cron: '0 13 * * *'  # Daily at 06:30 PM IST (01:00 PM UTC)
  workflow_dispatch:

jobs:
  crawl-macro-documents:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber pandas openpyxl

      - name: Install Playwright Chromium with OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Playwright Macro Scraper
        run: |
          python macro_monthly_dynamic_scraper.py

      - name: Commit and Push All Macro Deliverables
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Ek hi commit me PDFs, CSVs aur Telemetry JSON sab sync honge
          [ -f macro_telemetry_master.json ] && git add macro_telemetry_master.json
          [ -f macro_reports_manifest.json ] && git add macro_reports_manifest.json
          [ -f netc_fastag_monthly_3years.csv ] && git add netc_fastag_monthly_3years.csv
          [ -d downloaded_macro_pdfs ] && git add downloaded_macro_pdfs/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes found. Skipping commit."
          else
            git commit -m "📊 Sync Macro Telemetry, PDFs & FASTag [$(date +'%d-%b-%Y %H:%M IST')]"
            git pull --rebase origin main
            git push origin main
          fi
