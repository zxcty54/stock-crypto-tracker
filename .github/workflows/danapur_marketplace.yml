name: Danapur Marketplace — Flutter builds

on:
  push:
    branches: [main, arena/c2853110-stock-crypto-tracker]
    paths:
      - 'apps/danapur_marketplace/**'
      - '.github/workflows/danapur_marketplace.yml'
  pull_request:
    paths:
      - 'apps/danapur_marketplace/**'
      - '.github/workflows/danapur_marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: danapur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Database ownership & visibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-production-password
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-password
      PGDATABASE: marketplace_test
    steps:
      - uses: actions/checkout@v6
      - name: Apply schema twice and test RLS
        working-directory: apps/danapur_marketplace
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f test/sql/fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/001_marketplace.sql
          psql -v ON_ERROR_STOP=1 -f supabase/001_marketplace.sql
          psql -v ON_ERROR_STOP=1 -f test/sql/rls_test.sql

  flutter:
    name: Analyse, test, web and Android
    outputs:
      mode: ${{ steps.config.outputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/danapur_marketplace
    env:
      DANAPUR_SUPABASE_URL: ${{ secrets.DANAPUR_SUPABASE_URL }}
      DANAPUR_SUPABASE_ANON_KEY: ${{ secrets.DANAPUR_SUPABASE_ANON_KEY }}
      DANAPUR_ANDROID_KEYSTORE_BASE64: ${{ secrets.DANAPUR_ANDROID_KEYSTORE_BASE64 }}
      DANAPUR_KEYSTORE_PASSWORD: ${{ secrets.DANAPUR_KEYSTORE_PASSWORD }}
      DANAPUR_KEY_ALIAS: ${{ secrets.DANAPUR_KEY_ALIAS }}
      DANAPUR_KEY_PASSWORD: ${{ secrets.DANAPUR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Safe, separate app configuration
        id: config
        run: python3 tools/create_build_config.py "$RUNNER_TEMP/danapur-config.json"
      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Configuration and Telegram delivery tests
        run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse
        run: |
          set -o pipefail
          flutter analyze --no-pub --fatal-infos 2>&1 | tee "$RUNNER_TEMP/danapur-analysis.log"
      - name: Unit and responsive widget tests
        run: |
          set -o pipefail
          flutter test --no-pub --coverage 2>&1 | tee "$RUNNER_TEMP/danapur-tests.log"
      - name: Build web with local renderer assets
        run: |
          set -o pipefail
          flutter build web --no-pub --release --no-web-resources-cdn --dart-define-from-file="$RUNNER_TEMP/danapur-config.json" 2>&1 | tee "$RUNNER_TEMP/danapur-web.log"
      - name: Build one universal Android APK
        run: |
          set -o pipefail
          flutter build apk --no-pub --release --dart-define-from-file="$RUNNER_TEMP/danapur-config.json" 2>&1 | tee "$RUNNER_TEMP/danapur-android.log"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/danapur-bazaar.apk
      - name: Upload web app
        uses: actions/upload-artifact@v6
        with:
          name: danapur-bazaar-web
          path: apps/danapur_marketplace/build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload universal Android APK
        uses: actions/upload-artifact@v6
        with:
          name: danapur-bazaar-apk
          path: apps/danapur_marketplace/build/app/outputs/flutter-apk/danapur-bazaar.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency lock and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: danapur-ci-checks
          path: |
            apps/danapur_marketplace/pubspec.lock
            apps/danapur_marketplace/coverage/lcov.info
          retention-days: 7
      - name: Safe compiler diagnostics
        if: always()
        run: python3 tools/ci_diagnostics.py "$RUNNER_TEMP"
      - name: Build summary
        if: success()
        run: |
          {
            echo '## Danapur Bazaar'
            echo 'Mode: ${{ steps.config.outputs.mode }}'
            echo '- Download `danapur-bazaar-web` for the web app.'
            echo '- Download `danapur-bazaar-apk`: one universal `danapur-bazaar.apk` for ARMv7, ARM64 and x86_64.'
            echo '- Without a dedicated upload keystore this APK is a debug-signed release build, for testing only.'
            echo '- See apps/danapur_marketplace/README.md for cloud setup and launch limitations.'
          } >> "$GITHUB_STEP_SUMMARY"


  telegram:
    name: Deliver universal APK to Telegram
    needs: [backend-security, flutter]
    # Never send from a PR/fork, and wait for both build and policy checks.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/arena/c2853110-stock-crypto-tracker')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download the single APK
        uses: actions/download-artifact@v7
        with:
          name: danapur-bazaar-apk
          path: apps/danapur_marketplace/build/telegram/
      - name: Send APK directly using the existing Telegram bot
        working-directory: apps/danapur_marketplace
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHANNEL || secrets.CHAT_ID }}
        run: |
          python3 tools/send_apk_to_telegram.py build/telegram/danapur-bazaar.apk \
            --mode "${{ needs.flutter.outputs.mode }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
