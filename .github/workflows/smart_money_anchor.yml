name: BSE Smart Money Anchor & Floor Pipeline

on:
  schedule:
    # Market band hone ke baad Mon-Fri roz shaam 6:30 PM IST (13:00 UTC) par chalega
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # GitHub dashboard se manually run karne ke liye

concurrency:
  group: anchor-pipeline
  cancel-in-progress: true

jobs:
  run-anchor-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute BSE Anchor Hunter
        run: python smart_money_anchor_hunter.py

      - name: Commit and Push Updated Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add smart_money_anchor_report.json
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No fresh anchor updates found today."
          else
            git commit -m "chore: auto-update smart money floor report from BSE [skip ci]"
            git push
          fi
