name: BSE Smart Money Anchor and Floor Pipeline

on:
  schedule:
    # ⏰ Har Monday se Friday shaam 6:30 PM IST (13:00 UTC) par execute hoga
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-anchor-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 🚀 Execute BSE Anchor Hunter
        run: |
          python smart_money_anchor_hunter.py

      - name: 💾 Commit and Push Updated Report
        run: |
          git config --global user.name "AnchorHunterBot"
          git config --global user.email "bot@github-actions.internal"
          git add smart_money_anchor_report.json

          # Sirf tab commit karega agar JSON content mein koi naya change aaya ho
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in smart_money_anchor_report.json. Skipping commit."
          else
            git commit -m "🤖 Auto-Update: BSE Smart Money Anchor Report [skip ci]"
            git push
            echo "✅ Successfully pushed updated smart_money_anchor_report.json to repository!"
          fi
