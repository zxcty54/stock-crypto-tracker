- name: 💾 Commit and Push Updated Report
        run: |
          git config --global user.name "AnchorHunterBot"
          git config --global user.email "bot@github-actions.internal"

          if [ ! -f "smart_money_anchor_report.json" ]; then
            echo "⚠️ File smart_money_anchor_report.json was not generated by the script."
            exit 0
          fi

          git add smart_money_anchor_report.json

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in smart_money_anchor_report.json. Skipping commit."
          else
            git commit -m "🤖 Auto-Update: BSE Smart Money Anchor Report [skip ci]"
            git push
            echo "✅ Successfully pushed updated smart_money_anchor_report.json to repository!"
          fi
