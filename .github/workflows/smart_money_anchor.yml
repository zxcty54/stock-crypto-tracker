name: BSE Smart Money Anchor and Floor Pipeline

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-anchor-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 🚀 Execute BSE Anchor Hunter
        run: |
          python smart_money_anchor_hunter.py

      - name: 💾 Commit and Push Updated Report
        run: |
          git config --global user.name "AnchorHunterBot"
          git config --global user.email "bot@github-actions.internal"

          # Debug: Check if file was created
          ls -la

          # Agar file exist nahi karti toh crash hone se bachao
          if [ ! -f "smart_money_anchor_report.json" ]; then
            echo "⚠️ File smart_money_anchor_report.json not found. Exiting cleanly."
            exit 0
          fi

          git add smart_money_anchor_report.json

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in smart_money_anchor_report.json. Skipping commit."
          else
            git commit -m "🤖 Auto-Update: BSE Smart Money Anchor Report [skip ci]"
            git push
            echo "✅ Successfully pushed updated smart_money_anchor_report.json!"
          fi
