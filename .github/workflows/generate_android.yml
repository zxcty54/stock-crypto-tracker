name: Generate and Commit Android Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create Android Folder & Configure Files
        run: |
          # 1. Fresh android skeleton generate karein
          flutter create . --project-name stockpulse --org com.stockpulse --platforms=android

          # 2. Permissions add karein
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

          # 3. Share Intent filter add karein
          sed -i '/<\/activity>/i <intent-filter>\n    <action android:name="android.intent.action.SEND" />\n    <category android:name="android.intent.category.DEFAULT" />\n    <data android:mimeType="image/*" />\n</intent-filter>' android/app/src/main/AndroidManifest.xml

          # 4. compileSdk 37 configure karein
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk 3[0-6]/compileSdk 37/g' {} +

          # 5. Permanent build.gradle.kts set karein
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.stockpulse.app"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.stockpulse.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("keystore/upload-keystore.jks")
                      storePassword = "stockpulse@123"
                      keyAlias = "stockpulse-key"
                      keyPassword = "stockpulse@123"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Commit & Push Android Folder to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/
          git commit -m "chore: add permanent android folder with release signing"
          git push origin main
