name: Daily Macro Telemetry Scraper

on:
  schedule:
    # Runs daily at 12:30 PM UTC (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  scrape-macro-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install curl_cffi pdfplumber beautifulsoup4 pandas openpyxl

      - name: Run Macro Scraper
        run: |
          python macro_economic_telemetry_scraper.py

      - name: Commit and Push Telemetry Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_telemetry_master.json
          if git diff --staged --quiet; then
            echo "No new macro metrics found."
          else
            git commit -m "📊 Sync Macro Telemetry Master [$(date +'%d-%b-%Y')]"
            git push origin main
          fi
