name: Scrape Macro Telemetry

on:
  workflow_dispatch:

  # Optional: automatically run once every day
  schedule:
    - cron: "30 12 * * *"   # 18:00 IST

permissions:
  contents: write

jobs:
  scrape-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            curl_cffi \
            beautifulsoup4 \
            pdfplumber

      - name: Run macro scraper
        run: |
          python macro_telemetry_scraper.py

      - name: Verify output
        run: |
          echo "===== OUTPUT FILE ====="
          ls -lh macro_telemetry_master.json
          echo "===== FIRST 80 LINES ====="
          head -n 80 macro_telemetry_master.json

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add macro_telemetry_master.json

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Update macro telemetry data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi