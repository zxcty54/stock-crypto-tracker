name: Macro Pipeline

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: |
          pip install --upgrade pip
          pip install playwright pdfplumber pandas openpyxl google-genai
          playwright install --with-deps chromium

      - name: 1. Download Reports
        run: python macro_monthly_dynamic_scraper.py

      - name: 2. Parse to Raw JSON
        run: python parse_downloaded_reports.py

      - name: 3. Summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python summarize_macro_reports.py

      - name: 4. Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto sync macro telemetry"
            git pull --rebase origin main
            git push origin main
          fi
