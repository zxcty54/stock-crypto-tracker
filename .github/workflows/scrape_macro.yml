name: Scrape Macro Telemetry

on:
  workflow_dispatch:

  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  scrape-macro:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 pdfplumber

      - name: Verify Python scraper exists
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Python files:"
          find . -maxdepth 3 -type f -name "*.py" -print

          echo ""
          echo "Checking scraper:"
          test -f macro_telemetry_scraper.py
          echo "✅ macro_telemetry_scraper.py found"

      - name: Run macro scraper
        run: |
          python macro_telemetry_scraper.py

      - name: Verify output
        run: |
          test -f macro_telemetry_master.json

          echo ""
          echo "===== OUTPUT FILE ====="
          ls -lh macro_telemetry_master.json

          echo ""
          echo "===== JSON CHECK ====="
          python -m json.tool macro_telemetry_master.json > /dev/null

          echo "✅ Valid JSON"

          echo ""
          echo "===== DATA PREVIEW ====="
          head -n 100 macro_telemetry_master.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add macro_telemetry_master.json

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Update macro telemetry [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi