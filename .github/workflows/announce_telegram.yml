name: Telegram Channel Post Dispatcher

on:
  # 1. Main pipeline complete hote hi turant auto-trigger
  workflow_run:
    workflows: ["Hourly NSE Scraper & AI Summarizer Pipeline"]
    types:
      - completed

  # 2. Schedule: Har 30 min (09:00 AM IST se 10:00 PM IST)
  # Raat 10:00 PM se subah 09:00 AM IST band rahega
  schedule:
    - cron: '0,30 4-16 * * *'
    - cron: '30 3,16 * * *'

  # 3. GitHub UI se manual run ka option
  workflow_dispatch:

# Prevent scheduled and workflow_run dispatches from posting the same feed simultaneously.
concurrency:
  group: corporate-telegram-dispatch
  cancel-in-progress: false

jobs:
  broadcast-to-telegram:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Telegram Post Dispatcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python announce_telegram_bot.py

      - name: Commit and Push Delivery Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          [ -f telegram_posted_log.json ] && git add telegram_posted_log.json

          if git diff --staged --quiet; then
            echo "ℹ️ Koi naya post deliver nahi hua. Skipping commit."
          else
            git commit -m "⚡ Sync Telegram Delivery Log [$(date +'%d-%b-%Y %H:%M IST')]"
            git pull --rebase origin main
            git push origin main
          fi
