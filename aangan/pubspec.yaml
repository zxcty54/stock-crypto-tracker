name: aangan_bihar_rentals
description: A Bihar-first rental app with flexible house rules, private chat and admin-reviewed listings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend, email OTP auth, database, realtime chat and private photo storage.
  supabase_flutter: ^2.8.0

  # UI, local saved homes and listing photos.
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.1

  # Retained for the repository's legacy finance screens and networking helpers.
  http: ^1.2.0
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/aangan_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/aangan_icon.png
