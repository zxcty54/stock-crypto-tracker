name: danapur_marketplace
description: A local shop and product discovery marketplace for Danapur, Bihar.
publish_to: none
version: 1.0.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/fonts/OFL.txt
    - assets/fonts/NOTO-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-400.ttf
          weight: 400
    # The web engine expects a Roboto default face. Alias our bundled font
    # instead of making its otherwise automatic Google Fonts request.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
